<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Status</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .card {
    background: #111827;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    text-align: center;
    max-width: 400px;
    width: 90%;
  }

  h1 {
    margin-bottom: 0.5rem;
    font-size: 1.8rem;
  }

  p {
    opacity: 0.8;
    margin-bottom: 1.5rem;
  }

  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-weight: 500;
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: orange;
    animation: pulse 1.5s infinite;
  }

  .dot.online {
    background: #22c55e;
    animation: none;
  }

  .dot.offline {
    background: #ef4444;
    animation: none;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.5; }
    100% { transform: scale(1); opacity: 1; }
  }

  .retry {
    margin-top: 1.5rem;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .retry:hover {
    background: #2563eb;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Service Unavailable</h1>
  <p>We're having trouble reaching the server.<br>
     (Likely a temporary connection issue)</p>

  <div class="status">
    <div id="dot" class="dot"></div>
    <span id="status-text">Checking connection...</span>
  </div>

  <button class="retry" onclick="checkStatus()">Retry Now</button>
</div>

<script>
  // 🔴 CHANGE THESE TWO VALUES
  const CHECK_URL = "https://test.td97.uk"; // direct tunnel
  const REDIRECT_URL = "https://aprs.td97.uk"; // your normal domain

  async function checkStatus() {
    const dot = document.getElementById("dot");
    const text = document.getElementById("status-text");

    dot.className = "dot";
    text.textContent = "Checking connection...";

    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);

      await fetch(CHECK_URL, {
        method: "HEAD",
        cache: "no-store",
        signal: controller.signal
      });

      clearTimeout(timeout);

      dot.className = "dot online";
      text.textContent = "Service is back online! Redirecting...";

      setTimeout(() => {
        window.location.href = REDIRECT_URL;
      }, 1200);

    } catch (e) {
      dot.className = "dot offline";
      text.textContent = "Still offline. Retrying...";
    }
  }

  // Auto check every 5 seconds
  setInterval(checkStatus, 5000);

  // Initial check
  checkStatus();
</script>

</body>
